<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo ENI - Préférences</title>
    <meta name="description"
        content="Site de la promo EDWM2605FT de l'école ENI - Formation Développeur Web et Web Mobile - Page des Préférences">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/preferences.css">
</head>

<body>
    <header>
        <nav>
            <img src="assets/images/logo-eni.png" alt="Logo ENI" width="45" height="45">
            <h1>Promo EDWM2605FT</h1>
            <div>
                <a href="index.html">Accueil</a>
                <a href="preferences.html">Préférences</a>
                <a href="carte.html">Carte</a>
                <a href="informations.html">Informations</a>
            </div>
        </nav>
    </header>

    <h1 class="title">Préférences du site</h1>

    <section class="general">
        <form>
            <div>
                <label for="theme">Thème du site</label>
                <select name="theme" id="theme">
                    <option value="clair">Clair</option>
                    <option value="sombre">Sombre</option>
                </select>
            </div>
            <div>
                <p>Format d'affichage de la liste des apprenants</p>
                <div class="radioGroup">
                    <label>
                        <input type="radio" name="affichage" id="liste" value="liste" checked>
                        Liste (Tableau)
                    </label>
                    <label>
                        <input type="radio" name="affichage" id="cartes" value="cartes">
                        Cartes (Grille)
                    </label>
                </div>
            </div>
        </form>
    </section>

    <section class="button">
        <a href="index.html" class="retour">Retour à l'accueil</a>
        <button class="enregistrer">Enregistrer</button>
    </section>

    <script src="JS/preferences.js"></script>
</body>

</html>
