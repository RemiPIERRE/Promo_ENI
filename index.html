<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo ENI - Accueil</title>
    <meta name="description"
        content="Site de la promo EDWM2605FT de l'école ENI - Formation Développeur Web et Web Mobile - Page d'accueil">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/index.css">
    <script src="https://kit.fontawesome.com/a46f84f941.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <nav>
            <img class="logo" src="assets/images/logo-eni.png" alt="Logo ENI" width="45" height="45">
            <h1></h1>
            <button class="hamburger" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="nav-links">
                <a href="index.html">Accueil</a>
                <a href="preferences.html">Préférences</a>
                <a href="carte.html">Carte</a>
                <a href="informations.html">Informations</a>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div id="typeAffichage">
                <span>Type affichage : </span>
                <input type="radio" name="affichage" id="liste" value="liste" checked>
                <label for="liste">Liste</label>
                <input type="radio" name="affichage" id="cartes" value="cartes">
                <label for="cartes">Cartes</label>
            </div>
        </section>

        <section id="apprenants_list"></section>
        <section id="apprenants_card"></section>

        <dialog id="modalDetail">
            <button id="modalClose">X</button>
            <section class="modalTop">
                <div class="modalAvatar">
                    <img id="modalAvatar" src="" alt="Avatar apprenant">
                </div>
                <div class="modalInfos">
                    <p id="modalNom"></p>
                    <p id="modalPrenom"></p>
                    <p id="modalVille"></p>
                </div>
            </section>
            <p>Anecdotes :</p>
            <section class="modalBottom">
                <div id="modalAnecdotes"></div>
            </section>
        </dialog>
    </main>

    <footer>
        <span>Made by Rémi PIERRE</span>
        <span>Projet Web - ENI</span>
        <span>2026</span>
    </footer>
    
    <script src="JS/index.js"></script>
    <script src="JS/header.js"></script>
</body>

</html>
